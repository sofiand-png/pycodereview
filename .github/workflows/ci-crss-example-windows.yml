name: CRSS Example CI Windows

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

jobs:
  crss-example-tests-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package + dev deps (Windows)
        run: |
          pip install -r requirements-dev-windows.txt
          cd CRSS/6-Examples/crss_example_sensor_voting_reference/
          python -m pip install -U pip
          pip install -e .

      - name: Run tests with coverage (Windows)
        run: |
          cd CRSS/6-Examples/crss_example_sensor_voting_reference/
          coverage run --branch -m pytest
          coverage xml
          coverage report -m

      - name: Run TCP server/client smoke test (Windows)
        shell: bash
        run: |
          cd CRSS/6-Examples/crss_example_sensor_voting_reference/
          python -m crss_example_sensor_voting.app.tcp_sensor_server &
          SERVER_PID=$!
          sleep 2
          timeout 5 python -m crss_example_sensor_voting.app.tcp_controller_client || true
          kill $SERVER_PID || true

      - name: Offline smoke test (Windows)
        shell: bash
        run: |
          cd CRSS/6-Examples/crss_example_sensor_voting_reference/
          python -m crss_example_sensor_voting.app.main_loop

      - name: Upload coverage artifact (Windows)
        uses: actions/upload-artifact@v4
        with:
          name: crss-example-coverage-windows
          path: CRSS/6-Examples/crss_example_sensor_voting_reference/coverage.xml
          retention-days: 14
