name: CRSS Example Certified Build (Wheelhouse)

on:
  workflow_dispatch:
  push:
    tags:
      - "crss-example-v*"

permissions:
  contents: read

jobs:
  certified-linux:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Certified install (offline from wheelhouse)
        run: |
          cd CRSS/6-Examples/crss_example_sensor_voting_reference/

          python -m pip install -U pip

          # Install everything from wheelhouse only
          python -m pip install --no-index --find-links third_party/wheelhouse -r third_party/requirements.lock.txt

          # Install project without dependency resolution
          python -m pip install -e . --no-deps

      - name: Run tests with coverage
        run: |
          cd CRSS/6-Examples/crss_example_sensor_voting_reference/
          coverage run --branch -m pytest
          coverage xml
          coverage report -m

      - name: Offline smoke test
        run: |
          cd CRSS/6-Examples/crss_example_sensor_voting_reference/
          python -m crss_example_sensor_voting.app.main_loop

      - name: TCP smoke test
        run: |
          cd CRSS/6-Examples/crss_example_sensor_voting_reference/
          python -m crss_example_sensor_voting.app.tcp_sensor_server &
          SERVER_PID=$!
          sleep 2
          timeout 5 python -m crss_example_sensor_voting.app.tcp_controller_client || true
          kill $SERVER_PID || true

      - name: Upload certified evidence bundle (14 days)
        uses: actions/upload-artifact@v4
        with:
          name: crss-example-certified-evidence-linux
          path: |
            CRSS/6-Examples/crss_example_sensor_voting_reference/coverage.xml
            CRSS/6-Examples/crss_example_sensor_voting_reference/.coverage
          retention-days: 14
